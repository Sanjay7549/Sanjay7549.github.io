name: Deploy GitHub Pages Mirror

on:
  # Triggered by a repository_dispatch event sent from the private portfolio repo
  # after a successful prod deployment. See: dispatch step in private repo deploy.yml.
  repository_dispatch:
    types: [portfolio-deployed]

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Substitute the DOMAIN_NAME placeholder with the hardcoded production
      # domain. The GitHub Pages version always points canonical to the real domain.
      - name: Substitute Domain Variables
        env:
          DOMAIN_NAME: ${{ vars.CANONICAL_DOMAIN }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
          BUILD_DATE: ${{ github.event.client_payload.build_date || '' }}
        run: |
          set -euo pipefail

          BUILD_DATE="${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")}"
          RSS_DATE=$(date -u -R)

          # Process all template files
          for file in index.html sitemap.xml rss.xml security-policy.html js/main.js; do
            if [ -f "$file" ]; then
              envsubst '${DOMAIN_NAME} ${EMAIL_DOMAIN} ${BUILD_DATE} ${RSS_DATE}' \
                < "$file" > "${file}.processed"
              mv "${file}.processed" "$file"
            fi
          done

          # Generate robots.txt — allow indexing but canonical is the real domain
          cat > robots.txt <<EOF
          User-agent: *
          Allow: /

          Sitemap: https://${DOMAIN_NAME}/sitemap.xml
          EOF

          # Generate .well-known/security.txt
          mkdir -p .well-known
          if [ -f "security.txt" ]; then
            envsubst '${DOMAIN_NAME} ${EMAIL_DOMAIN}' < security.txt > .well-known/security.txt
            cp .well-known/security.txt security.txt
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
